name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Verify tag matches application version
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 tools/ci/check_version.py --tag "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      signed-release: true
      build-ref: ${{ needs.validate.outputs.commit }}
    secrets: inherit

  draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true
      - name: Verify downloaded packages and combine checksums
        run: python3 tools/ci/verify_release.py dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERIFIED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          python3 tools/ci/verify_tag.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --commit "$VERIFIED_COMMIT"
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.zip dist/SHA256SUMS.txt --verify-tag --draft --title "岐黄课表 $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
